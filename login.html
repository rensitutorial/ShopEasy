
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEasy - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navigation */
        header {
            background: #2874f0;
            color: white;
            padding: 18px 6%;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        nav h2 {
            color: white;
            font-size: 26px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 15px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        /* Login Section */
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 15px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .login-icon {
            text-align: center;
            font-size: 45px;
            margin-bottom: 10px;
        }

        .login-container h2 {
            text-align: center;
            color: #222;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .login-container label {
            display: block;
            margin-bottom: 7px;
            color: #333;
            font-weight: bold;
            font-size: 14px;
        }

        .login-container input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .login-container input:focus {
            outline: none;
            border-color: #2874f0;
            box-shadow: 0 0 4px rgba(40, 116, 240, 0.3);
        }

        .login-container button {
            width: 100%;
            padding: 13px;
            background: #2874f0;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .login-container button:hover {
            background: #1558c0;
        }

        .login-container p {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #555;
        }

        .login-container a {
            color: #2874f0;
            text-decoration: none;
            font-weight: bold;
        }

        .login-container a:hover {
            text-decoration: underline;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
        }

        .error {
            color: #d32f2f;
        }

        .success {
            color: #16803c;
        }

        /* Footer */
        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 18px;
        }

        /* Mobile Design */
        @media (max-width: 500px) {
            nav {
                flex-direction: column;
            }

            nav a {
                margin: 0 7px;
            }

            .login-container {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <header>
        <nav>
            <h2>🛒 ShopEasy</h2>

            <div>
                <a href="index.html">Home</a>
                <a href="products.html">Products</a>
                <a href="cart.html">Cart</a>
                <a href="register.html">Register</a>
            </div>
        </nav>
    </header>

    <!-- Main Login Section -->
    <main class="main-content">
        <div class="login-container">

            <div class="login-icon">🔐</div>

            <h2>Welcome Back!</h2>

            <p class="subtitle">
                Login to continue shopping with ShopEasy.
            </p>

            <form id="loginForm">

                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit">Login</button>

                <div id="message" class="message"></div>

            </form>

            <p>
                Don't have an account?
                <a href="register.html">Create Account</a>
            </p>

        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>© 2026 ShopEasy. All Rights Reserved.</p>
    </footer>

    <!-- JavaScript -->
    <script>
        const loginForm = document.getElementById("loginForm");
        const message = document.getElementById("message");

        loginForm.addEventListener("submit", function(event) {
            event.preventDefault();

            const email = document.getElementById("email")
                .value.trim().toLowerCase();

            const password = document.getElementById("password").value;

            let user;

            // Get registered user
            try {
                user = JSON.parse(
                    localStorage.getItem("shopEasyUser")
                );
            } catch (error) {
                user = null;
            }

            // Check registration
            if (!user) {
                showMessage(
                    "Please register before logging in.",
                    "error"
                );
                return;
            }

            // Check login details
            if (
                email === String(user.email).toLowerCase() &&
                password === user.password
            ) {
                // Save login session
                localStorage.setItem(
                    "shopEasyLoggedIn",
                    JSON.stringify({
                        name: user.name,
                        email: user.email
                    })
                );

                showMessage(
                    "Login successful! Welcome, " + user.name,
                    "success"
                );

                loginForm.reset();

                // Redirect to home page
                setTimeout(function() {
                    window.location.href = "index.html";
                }, 1200);

            } else {
                showMessage(
                    "Invalid email or password!",
                    "error"
                );
            }
        });

        // Display messages
        function showMessage(text, type) {
            message.textContent = text;
            message.className = "message " + type;
        }
    </script>

</body>
</html>
