
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEasy - My Orders</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f4f4;
            color: #333;
        }

        header {
            background: #222;
            color: white;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        header h2 {
            color: #ff9800;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        nav a:hover {
            color: #ff9800;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 35px;
        }

        .summary-card {
            background: white;
            padding: 22px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .summary-card h3 {
            font-size: 16px;
            color: #555;
            margin-bottom: 12px;
        }

        .summary-card p {
            font-size: 25px;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        .blue { color: #2196f3; }
        .green { color: #16803c; }
        .red { color: #d32f2f; }
        .orange { color: #ff9800; }

        .order-card {
            background: white;
            padding: 22px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .order-card h2 {
            color: #ff9800;
            margin-bottom: 15px;
            overflow-wrap: anywhere;
        }

        .order-card p {
            margin: 10px 0;
            line-height: 1.5;
        }

        .product-list {
            margin: 10px 0 15px 25px;
        }

        .product-list li {
            margin-bottom: 8px;
            line-height: 1.5;
        }

        .total {
            font-size: 18px;
            font-weight: bold;
            margin-top: 15px;
        }

        .status {
            font-weight: bold;
            color: #16803c;
        }

        .cancelled {
            color: #d32f2f;
        }

        button {
            border: none;
            padding: 10px 18px;
            margin-top: 15px;
            margin-right: 10px;
            border-radius: 5px;
            cursor: pointer;
            color: white;
            font-size: 14px;
        }

        .details-btn {
            background: #2196f3;
        }

        .details-btn:hover {
            background: #1976d2;
        }

        .cancel-btn {
            background: #e53935;
        }

        .cancel-btn:hover {
            background: #c62828;
        }

        .cancel-btn:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .empty {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        .back-btn {
            display: inline-block;
            margin-top: 20px;
            background: #ff9800;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
        }

        footer {
            text-align: center;
            background: #222;
            color: white;
            padding: 15px;
            margin-top: 40px;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 500px;
            padding: 25px;
            border-radius: 10px;
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-content h2 {
            color: #ff9800;
            margin-bottom: 20px;
        }

        .modal-content p {
            margin: 12px 0;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .close-btn {
            background: #555;
            float: right;
            margin-top: 0;
        }

        .close-btn:hover {
            background: #333;
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
            }

            nav {
                text-align: center;
            }

            nav a {
                margin: 0 6px;
                display: inline-block;
                padding: 5px 0;
            }

            .container {
                margin: 20px auto;
                padding: 12px;
            }

            .order-card {
                padding: 16px;
            }

            .summary {
                gap: 10px;
            }

            .summary-card {
                padding: 15px 8px;
            }

            .summary-card h3 {
                font-size: 13px;
            }

            .summary-card p {
                font-size: 21px;
            }

            button {
                margin-right: 5px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h2>ShopEasy</h2>

        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart</a>
            <a href="orders.html">My Orders</a>
        </nav>
    </header>

    <div class="container">

        <h1>My Order History</h1>

        <div class="summary">

            <div class="summary-card">
                <h3>Total Orders</h3>
                <p class="blue" id="totalOrders">0</p>
            </div>

            <div class="summary-card">
                <h3>Active Orders</h3>
                <p class="green" id="activeOrders">0</p>
            </div>

            <div class="summary-card">
                <h3>Cancelled Orders</h3>
                <p class="red" id="cancelledOrders">0</p>
            </div>

            <div class="summary-card">
                <h3>Total Spent</h3>
                <p class="orange" id="totalSpent">₹0.00</p>
            </div>

        </div>

        <div id="ordersContainer"></div>

        <div style="text-align:center;">
            <a href="products.html" class="back-btn">
                Continue Shopping
            </a>
        </div>

    </div>

    <!-- Order Details Popup -->
    <div class="modal" id="detailsModal">
        <div class="modal-content">

            <button class="close-btn" onclick="closeDetails()">
                Close
            </button>

            <h2>Order Details</h2>

            <div id="detailsContent"></div>

        </div>
    </div>

    <footer>
        <p>&copy; 2026 ShopEasy. All Rights Reserved.</p>
    </footer>

    <script>

        // Check whether the user is logged in
        let loggedInUser = null;

        try {
            loggedInUser = JSON.parse(
                localStorage.getItem("shopEasyLoggedIn")
            );
        } catch (error) {
            loggedInUser = null;
        }

        if (!loggedInUser || !loggedInUser.email) {
            alert("Please login to view your orders.");
            window.location.href = "login.html";
        }

        // Get only the current user's orders
        function getOrders() {
            try {
                const allOrders = JSON.parse(
                    localStorage.getItem("shopEasyOrders")
                ) || [];

                return allOrders
                    .map((order, index) => ({
                        order: order,
                        originalIndex: index
                    }))
                    .filter(entry =>
                        entry.order.customerEmail &&
                        entry.order.customerEmail.toLowerCase() ===
                        loggedInUser.email.toLowerCase()
                    );
            } catch (error) {
                return [];
            }
        }

        // Format currency
        function formatPrice(amount) {
            return "₹" + (Number(amount) || 0).toFixed(2);
        }

        // Update summary cards
        function updateSummary(orders) {

            const cancelled = orders.filter(
                entry => entry.order.status === "Cancelled"
            ).length;

            const active = orders.length - cancelled;

            const spent = orders.reduce(function(sum, entry) {
                if (entry.order.status !== "Cancelled") {
                    return sum +
                        (Number(entry.order.total) || 0);
                }

                return sum;
            }, 0);

            document.getElementById("totalOrders").textContent =
                orders.length;

            document.getElementById("activeOrders").textContent =
                active;

            document.getElementById("cancelledOrders").textContent =
                cancelled;

            document.getElementById("totalSpent").textContent =
                formatPrice(spent);
        }

        // Display orders
        function displayOrders() {

            const container =
                document.getElementById("ordersContainer");

            const orders = getOrders();

            container.innerHTML = "";

            updateSummary(orders);

            if (orders.length === 0) {
                container.innerHTML = `
                    <div class="empty">
                        <h3>No Orders Found</h3>
                        <p>Your orders will appear here.</p>
                    </div>
                `;

                return;
            }

            // Newest orders first
            orders.reverse().forEach(function(entry) {

                const order = entry.order;
                const index = entry.originalIndex;

                const isCancelled =
                    order.status === "Cancelled";

                const card =
                    document.createElement("div");

                card.className = "order-card";

                const heading =
                    document.createElement("h2");

                heading.textContent =
                    "Order #" + (order.id || "N/A");

                card.appendChild(heading);

                const date =
                    document.createElement("p");

                date.textContent =
                    "Order Date: " +
                    (order.date || "Not available");

                card.appendChild(date);

                const productsTitle =
                    document.createElement("p");

                productsTitle.textContent = "Products:";

                card.appendChild(productsTitle);

                const list =
                    document.createElement("ul");

                list.className = "product-list";

                (order.products || []).forEach(function(product) {

                    const quantity =
                        Number(product.quantity) || 1;

                    const price =
                        Number(product.price) || 0;

                    const item =
                        document.createElement("li");

                    item.textContent =
                        (product.name || "Product") +
                        " — " + formatPrice(price) +
                        " × " + quantity +
                        " = " +
                        formatPrice(price * quantity);

                    list.appendChild(item);
                });

                card.appendChild(list);

                const total =
                    document.createElement("p");

                total.className = "total";

                total.textContent =
                    "Total: " + formatPrice(order.total);

                card.appendChild(total);

                const status =
                    document.createElement("p");

                status.textContent = "Status: ";

                const statusText =
                    document.createElement("span");

                statusText.className =
                    isCancelled ? "status cancelled" : "status";

                statusText.textContent =
                    order.status || "Order Placed";

                status.appendChild(statusText);

                card.appendChild(status);

                // View Details button
                const detailsButton =
                    document.createElement("button");

                detailsButton.className = "details-btn";
                detailsButton.textContent = "View Details";

                detailsButton.onclick = function() {
                    viewOrderDetails(index);
                };

                card.appendChild(detailsButton);

                // Cancel Order button
                const cancelButton =
                    document.createElement("button");

                cancelButton.className = "cancel-btn";

                cancelButton.textContent = isCancelled
                    ? "Order Cancelled"
                    : "Cancel Order";

                cancelButton.disabled = isCancelled;

                if (!isCancelled) {
                    cancelButton.onclick = function() {
                        cancelOrder(index);
                    };
                }

                card.appendChild(cancelButton);

                container.appendChild(card);
            });
        }

        // View order details
        function viewOrderDetails(index) {

            const allOrders = JSON.parse(
                localStorage.getItem("shopEasyOrders")
            ) || [];

            const order = allOrders[index];

            if (!order ||
                !order.customerEmail ||
                order.customerEmail.toLowerCase() !==
                loggedInUser.email.toLowerCase()) {

                alert("Order not found.");
                return;
            }

            const details =
                document.getElementById("detailsContent");

            details.innerHTML = "";

            const fields = [
                ["Order ID", order.id],
                ["Order Date", order.date],
                ["Customer Name", order.customerName],
                ["Phone", order.phone],
                ["Address", order.address],
                ["Payment Method", order.payment]
            ];

            fields.forEach(function(field) {

                const p = document.createElement("p");

                const strong =
                    document.createElement("strong");

                strong.textContent = field[0] + ": ";

                p.appendChild(strong);

                p.appendChild(
                    document.createTextNode(
                        field[1] || "Not available"
                    )
                );

                details.appendChild(p);
            });

            const divider =
                document.createElement("hr");

            divider.style.margin = "15px 0";

            details.appendChild(divider);

            const title =
                document.createElement("h3");

            title.textContent = "Products";

            details.appendChild(title);

            (order.products || []).forEach(function(product) {

                const quantity =
                    Number(product.quantity) || 1;

                const price =
                    Number(product.price) || 0;

                const p =
                    document.createElement("p");

                p.textContent =
                    (product.name || "Product") +
                    " — " + formatPrice(price) +
                    " × " + quantity +
                    " = " +
                    formatPrice(price * quantity);

                details.appendChild(p);
            });

            const total =
                document.createElement("p");

            const totalStrong =
                document.createElement("strong");

            totalStrong.textContent = "Total: ";

            total.appendChild(totalStrong);

            total.appendChild(
                document.createTextNode(
                    formatPrice(order.total)
                )
            );

            details.appendChild(total);

            const status =
                document.createElement("p");

            status.textContent =
                "Status: " + (order.status || "Order Placed");

            details.appendChild(status);

            document.getElementById("detailsModal").style.display =
                "flex";
        }

        // Close popup
        function closeDetails() {
            document.getElementById("detailsModal").style.display =
                "none";
        }

        // Close popup when clicking outside
        document.getElementById("detailsModal").onclick =
            function(event) {

                if (event.target === this) {
                    closeDetails();
                }
            };

        // Cancel an order
        function cancelOrder(index) {

            const allOrders = JSON.parse(
                localStorage.getItem("shopEasyOrders")
            ) || [];

            const order = allOrders[index];

            if (!order ||
                !order.customerEmail ||
                order.customerEmail.toLowerCase() !==
                loggedInUser.email.toLowerCase()) {

                alert("Order not found.");
                return;
            }

            if (order.status === "Cancelled") {
                alert("This order is already cancelled.");
                return;
            }

            const confirmCancel = confirm(
                "Are you sure you want to cancel this order?"
            );

            if (!confirmCancel) {
                return;
            }

            allOrders[index].status = "Cancelled";

            localStorage.setItem(
                "shopEasyOrders",
                JSON.stringify(allOrders)
            );

            alert("Your order has been cancelled.");

            displayOrders();
        }

        // Load orders when page opens
        if (loggedInUser && loggedInUser.email) {
            displayOrders();
        }

    </script>

</body>
</html>
