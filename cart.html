
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEasy - Shopping Cart</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        .cart-section {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .cart-section h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            flex-wrap: wrap;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quantity-controls button,
        .remove-button,
        .cart-summary button {
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .cart-summary {
            text-align: right;
            margin-top: 25px;
        }

        .cart-summary button {
            margin: 10px 0 0 8px;
        }

        .remove-button,
        #clearCartButton {
            background: #dc3545;
            color: white;
        }

        #checkoutButton {
            background: #198754;
            color: white;
        }

        .empty-cart {
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <header>
        <nav class="navbar">
            <h1 class="logo">🛒 ShopEasy</h1>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="cart.html">Cart 🛒</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <!-- Cart Section -->
    <section class="cart-section">
        <h2>Shopping Cart</h2>

        <div id="cartItems">
            <p class="empty-cart">Your cart is empty.</p>
        </div>

        <!-- Cart Total -->
        <div class="cart-summary">
            <h3>Total: ₹<span id="cartTotal">0</span></h3>

            <button id="clearCartButton" onclick="clearCart()">
                Remove All Items
            </button>

            <button id="checkoutButton" onclick="goToCheckout()">
                Proceed to Checkout
            </button>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>© 2026 ShopEasy. All Rights Reserved.</p>
    </footer>

    <script>
        // Get cart items from localStorage
        let cart = JSON.parse(localStorage.getItem("cart")) || [];

        // Display cart products
        function displayCart() {
            const cartItems = document.getElementById("cartItems");
            const cartTotal = document.getElementById("cartTotal");

            cartItems.innerHTML = "";
            let total = 0;

            if (cart.length === 0) {
                cartItems.innerHTML =
                    '<p class="empty-cart">Your cart is empty.</p>';
                cartTotal.textContent = "0";
                return;
            }

            cart.forEach((item, index) => {
                const price = Number(item.price) || 0;
                const quantity = Math.max(1, Number(item.quantity) || 1);
                const itemTotal = price * quantity;

                total += itemTotal;

                const product = document.createElement("div");
                product.className = "cart-item";

                product.innerHTML = `
                    <div>
                        <h3>${item.name}</h3>
                        <p>Price: ₹${price}</p>
                    </div>

                    <div class="quantity-controls">
                        <button onclick="changeQuantity(${index}, -1)">−</button>
                        <span>${quantity}</span>
                        <button onclick="changeQuantity(${index}, 1)">+</button>
                    </div>

                    <p>Subtotal: ₹${itemTotal.toFixed(2)}</p>

                    <button class="remove-button"
                        onclick="removeItem(${index})">
                        Remove
                    </button>
                `;

                cartItems.appendChild(product);
            });

            cartTotal.textContent = total.toFixed(2);
        }

        // Increase or decrease quantity
        function changeQuantity(index, change) {
            cart[index].quantity =
                Math.max(1, (Number(cart[index].quantity) || 1) + change);

            saveCart();
        }

        // Remove one product
        function removeItem(index) {
            cart.splice(index, 1);
            saveCart();
        }

        // Remove all products
        function clearCart() {
            if (cart.length === 0) {
                alert("Your cart is already empty.");
                return;
            }

            if (confirm("Are you sure you want to remove all items?")) {
                cart = [];
                saveCart();
            }
        }

        // Save cart and refresh display
        function saveCart() {
            localStorage.setItem("cart", JSON.stringify(cart));
            displayCart();
        }

        // Go to checkout page
        function goToCheckout() {
            if (cart.length === 0) {
                alert("Your cart is empty. Add products first.");
                return;
            }

            window.location.href = "checkout.html";
        }

        // Show cart when page loads
        displayCart();
    </script>

</body>
</html>
